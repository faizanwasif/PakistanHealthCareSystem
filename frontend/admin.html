<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Pakistan Healthcare</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card h3 {
            margin: 0 0 10px 0;
            color: #666;
            font-size: 0.9em;
        }
        
        .stat-card .number {
            font-size: 2.5em;
            font-weight: bold;
            color: #1976d2;
        }
        
        .applications-table {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-tab {
            padding: 10px 20px;
            border: none;
            background: #f0f0f0;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .filter-tab.active {
            background: #1976d2;
            color: white;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: #f5f5f5;
            font-weight: bold;
            color: #666;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }
        
        .status-pending {
            background: #fff3e0;
            color: #e65100;
        }
        
        .status-approved {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status-rejected {
            background: #ffebee;
            color: #c62828;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: opacity 0.3s;
        }
        
        .btn:hover {
            opacity: 0.8;
        }
        
        .btn-approve {
            background: #4caf50;
            color: white;
        }
        
        .btn-reject {
            background: #f44336;
            color: white;
        }
        
        .btn-view {
            background: #2196f3;
            color: white;
        }
    </style>
</head>
<body>
    <header style="background: white; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px;">
        <div style="max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 style="margin: 0; color: #1976d2;">🏥 Admin Panel</h1>
                <p style="margin: 5px 0 0 0; color: #666;">Pakistan Healthcare System</p>
            </div>
            <div>
                <button onclick="logout()" style="padding: 10px 20px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">
                    Logout
                </button>
            </div>
        </div>
    </header>
    
    <div class="admin-container">
        <!-- Statistics -->
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="number" id="total-users">-</div>
            </div>
            <div class="stat-card">
                <h3>Active Sehat Cards</h3>
                <div class="number" id="active-cards">-</div>
            </div>
            <div class="stat-card">
                <h3>Pending Applications</h3>
                <div class="number" id="pending-apps">-</div>
            </div>
            <div class="stat-card">
                <h3>Approved</h3>
                <div class="number" id="approved-apps">-</div>
            </div>
            <div class="stat-card">
                <h3>Rejected</h3>
                <div class="number" id="rejected-apps">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Conversations</h3>
                <div class="number" id="total-convs">-</div>
            </div>
        </div>
        
        <!-- Applications Table -->
        <div class="applications-table">
            <h2 style="margin-top: 0;">Sehat Card Applications</h2>
            
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterApplications('all')">All</button>
                <button class="filter-tab" onclick="filterApplications('pending')">Pending</button>
                <button class="filter-tab" onclick="filterApplications('approved')">Approved</button>
                <button class="filter-tab" onclick="filterApplications('rejected')">Rejected</button>
            </div>
            
            <div id="applications-container">
                <p style="text-align: center; color: #666;">Loading applications...</p>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        let authToken = localStorage.getItem('token');
        let currentFilter = 'all';
        
        if (!authToken) {
            window.location.href = 'login.html';
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
        
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (!response.ok) throw new Error('Not authorized');
                
                const data = await response.json();
                
                document.getElementById('total-users').textContent = data.total_users;
                document.getElementById('active-cards').textContent = data.active_sehat_cards;
                document.getElementById('pending-apps').textContent = data.pending_applications;
                document.getElementById('approved-apps').textContent = data.approved_applications;
                document.getElementById('rejected-apps').textContent = data.rejected_applications;
                document.getElementById('total-convs').textContent = data.total_conversations;
                
            } catch (error) {
                console.error('Error loading stats:', error);
                alert('Admin access required. Redirecting to login...');
                logout();
            }
        }
        
        async function loadApplications(status = 'all') {
            try {
                const response = await fetch(`${API_BASE}/api/admin/sehat-card/applications?status=${status}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (!response.ok) throw new Error('Failed to load');
                
                const data = await response.json();
                displayApplications(data.applications);
                
            } catch (error) {
                console.error('Error loading applications:', error);
            }
        }
        
        function displayApplications(applications) {
            const container = document.getElementById('applications-container');
            
            if (applications.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">No applications found</p>';
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Income</th>
                            <th>Family</th>
                            <th>Applied</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            applications.forEach(app => {
                const statusClass = `status-${app.status}`;
                const appliedDate = new Date(app.applied_at).toLocaleDateString();
                
                html += `
                    <tr>
                        <td>${app.name}</td>
                        <td>${app.phone}</td>
                        <td>PKR ${app.monthly_income.toLocaleString()}</td>
                        <td>${app.family_members}</td>
                        <td>${appliedDate}</td>
                        <td><span class="status-badge ${statusClass}">${app.status.toUpperCase()}</span></td>
                        <td>
                            <div class="action-buttons">
                                ${app.status === 'pending' ? `
                                    <button class="btn btn-approve" onclick="approveApplication('${app.application_id}')">Approve</button>
                                    <button class="btn btn-reject" onclick="rejectApplication('${app.application_id}')">Reject</button>
                                ` : ''}
                                <button class="btn btn-view" onclick="viewDetails('${app.application_id}')">View</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        function filterApplications(status) {
            currentFilter = status;
            
            // Update active tab
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            loadApplications(status);
        }
        
        async function approveApplication(appId) {
            if (!confirm('Approve this application?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/admin/sehat-card/approve/${appId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ notes: 'Approved by admin' })
                });
                
                if (!response.ok) throw new Error('Failed to approve');
                
                alert('Application approved successfully!');
                loadStats();
                loadApplications(currentFilter);
                
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        async function rejectApplication(appId) {
            const reason = prompt('Enter rejection reason:');
            if (!reason) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/admin/sehat-card/reject/${appId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ reason: reason })
                });
                
                if (!response.ok) throw new Error('Failed to reject');
                
                alert('Application rejected');
                loadStats();
                loadApplications(currentFilter);
                
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        function viewDetails(appId) {
            alert('View details for: ' + appId);
            // Implement detailed view modal if needed
        }
        
        // Load data on page load
        loadStats();
        loadApplications();
        
        // Refresh every 30 seconds
        setInterval(() => {
            loadStats();
            loadApplications(currentFilter);
        }, 30000);
    </script>
</body>
</html>
