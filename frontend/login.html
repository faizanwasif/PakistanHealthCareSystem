<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pakistan Healthcare System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h1 {
            color: #1976d2;
            margin-bottom: 10px;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            margin-bottom: 5px;
            color: #666;
            font-weight: 500;
        }
        
        .form-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1976d2;
        }
        
        .auth-button {
            padding: 15px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        
        .auth-button:hover {
            background: #1565c0;
        }
        
        .auth-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .toggle-auth a {
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }
        
        .toggle-auth a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        
        #signup-form {
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🏥 Pakistan Healthcare</h1>
            <p>AI-Powered Healthcare Coordination</p>
        </div>
        
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <!-- Login Form -->
        <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
            <h2 style="text-align: center; color: #1976d2;">Login</h2>
            
            <div class="form-group">
                <label for="login-phone">Phone Number / Username</label>
                <input type="text" id="login-phone" placeholder="+92-300-1234567 or admin" required>
            </div>
            
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="auth-button" id="login-button">
                Login
            </button>
            
            <div style="background: #e3f2fd; padding: 12px; border-radius: 8px; margin: 15px 0; text-align: center;">
                <p style="margin: 0 0 8px 0; font-size: 0.85em; color: #1976d2;">
                    <strong>Admin Login:</strong><br>
                    Username: <code style="background: white; padding: 2px 6px; border-radius: 3px;">admin</code> | 
                    Password: <code style="background: white; padding: 2px 6px; border-radius: 3px;">admin</code>
                </p>
                <button type="button" onclick="quickAdminLogin()" style="padding: 6px 16px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em;">
                    Quick Admin Login
                </button>
            </div>
            
            <div class="toggle-auth">
                Don't have an account? <a href="#" onclick="toggleForms(); return false;">Sign Up</a>
            </div>
        </form>
        
        <!-- Signup Form -->
        <form id="signup-form" class="auth-form" onsubmit="handleSignup(event)">
            <h2 style="text-align: center; color: #1976d2;">Sign Up</h2>
            
            <div class="form-group">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" placeholder="Ahmed Khan" required>
            </div>
            
            <div class="form-group">
                <label for="signup-phone">Phone Number</label>
                <input type="tel" id="signup-phone" placeholder="+92-300-1234567" required>
            </div>
            
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Create a password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="signup-confirm">Confirm Password</label>
                <input type="password" id="signup-confirm" placeholder="Confirm your password" required>
            </div>
            
            <button type="submit" class="auth-button" id="signup-button">
                Sign Up
            </button>
            
            <div class="toggle-auth">
                Already have an account? <a href="#" onclick="toggleForms(); return false;">Login</a>
            </div>
        </form>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        
        function toggleForms() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'flex';
                signupForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'flex';
            }
            
            hideMessages();
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
        
        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            hideMessages();
            
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;
            const button = document.getElementById('login-button');
            
            button.disabled = true;
            button.textContent = 'Logging in...';
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Login failed');
                }
                
                const data = await response.json();
                
                // Store token and user info
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('user_name', data.name);
                
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
                
            } catch (error) {
                showError(error.message);
                button.disabled = false;
                button.textContent = 'Login';
            }
        }
        
        async function handleSignup(event) {
            event.preventDefault();
            hideMessages();
            
            const name = document.getElementById('signup-name').value;
            const phone = document.getElementById('signup-phone').value;
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;
            const button = document.getElementById('signup-button');
            
            if (password !== confirm) {
                showError('Passwords do not match');
                return;
            }
            
            button.disabled = true;
            button.textContent = 'Creating account...';
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, password })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Signup failed');
                }
                
                const data = await response.json();
                
                // Store token and user info
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('user_name', data.name);
                
                showSuccess('Account created! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
                
            } catch (error) {
                showError(error.message);
                button.disabled = false;
                button.textContent = 'Sign Up';
            }
        }
        
        function quickAdminLogin() {
            document.getElementById('login-phone').value = 'admin';
            document.getElementById('login-password').value = 'admin';
            document.getElementById('login-form').dispatchEvent(new Event('submit'));
        }
        
        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
